name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - DEV
jobs:
  flutter:
    name: Flutter Checks
    runs-on: ${{ vars.CI_5070X_ENABLED == 'true' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'ci-5070x-linux' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare bundled dependencies
        run: "dart scripts/prepare_bundled_deps.dart || true"
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
